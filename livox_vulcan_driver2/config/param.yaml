/**:
  livox_vulcan_node:
    ros__parameters:
      config_path: ""
      cloud_topic: "livox/pointcloud"
      custom_topic: "livox/custom_msg"
      imu_topic: "livox/imu"
      time_sync_soft: true
      time_sync_wait_count: 10
      min_range: 0.2       # meters; points closer than this are dropped from all outputs (0 = disabled)

      # autocube_link 坐标系下的长方体排除区域（单位：米）。
      # 坐标约定：前=+X，后=-X，左=+Y，右=-Y，上=+Z，下=-Z。
      # 落在边界上或长方体内部的点不会进入 livox/custom_msg 和 livox/pointcloud。
      exclusion_box:
        enabled: true
        front: 0.0
        back: 0.5
        left: 0.15
        right: 0.15
        top: 0.2
        bottom: 0.2
