/**:
  livox_tools_node:
    ros__parameters:
      cloud_topic: "/livox/pointcloud"
      imu_topic: "/livox/imu"
      trans_point_topic: "/livox/pointcloud/transform"
      laserscan_topic: "/autocube/laserscan"
      base_link: "base_link"
      min_z: -0.1
      max_z: 0.8
      intensity_threshold: 7.0  # Only points with intensity >= threshold enter LaserScan (0-255)
      enable_log: False
      range_min: 0.1
      range_max: 10.0
